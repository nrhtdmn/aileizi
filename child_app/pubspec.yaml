name: family_tracker_child
description: Aileİzi — Aile ve Çocuk Takip (Çocuk)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_messaging: ^14.7.10
  
  # Konum (arka plan dahil)
  geolocator: 13.0.4
  google_maps_flutter: ^2.5.3
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^19.5.0
  battery_plus: ^5.0.3
  
  # Uygulama kullanımı (sadece Android)
  usage_stats: ^1.3.1
  
  # State
  provider: ^6.1.1
  intl: any
  google_fonts: ^6.2.1
  firebase_storage: ^11.6.5
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
