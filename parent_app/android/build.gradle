allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { project ->
    if (project.name != "app" && !project.hasProperty("flutter")) {
        project.ext.flutter = [
            compileSdkVersion: 35,
            minSdkVersion    : 23,
            targetSdkVersion : 35
        ]
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
